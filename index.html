<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excuse Me Counter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    #login label { display: block; font-size: 2rem; margin-bottom: 16px; }
    #login input {
      font-size: 1.5rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid #444;
      background: #222;
      color: #fff;
      width: min(320px, 80vw);
    }
    #login button {
      font-size: 1.5rem;
      padding: 10px 20px;
      margin-left: 8px;
      border-radius: 8px;
      border: none;
      background: #ffcc00;
      color: #111;
      cursor: pointer;
    }
    #counter { display: none; }
    #title { font-size: clamp(2rem, 7vw, 5rem); font-weight: 800; margin: 0 0 10px; }
    #count {
      font-size: clamp(5rem, 25vw, 16rem);
      font-weight: 900;
      color: #ffcc00;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: transform 0.08s;
    }
    #count.bump { transform: scale(1.08); }
    #hint { margin-top: 24px; font-size: 1.2rem; color: #aaa; }
    #tap {
      display: none;
      margin-top: 20px;
      font-size: 1.3rem;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      background: #ffcc00;
      color: #111;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="login">
    <label for="username">Enter a Username:</label>
    <input id="username" autocomplete="off" autofocus />
    <button type="submit">Go</button>
  </form>

  <div id="counter">
    <h1 id="title">Excuse Me</h1>
    <div id="count">0</div>
    <div id="hint"></div>
    <button id="tap">Press (for phones)</button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Public project URL and publishable key (safe to be public).
    // The secret word is NOT here: the database checks it.
    const supabase = createClient(
      "https://flifswwrhevzjwwhqitc.supabase.co",
      "sb_publishable_7IMTnMht7y8er5RoyyXZng_g6wbkAPW"
    );

    let username = "";
    let isEditor = false;
    let current = 0;

    const countEl = document.getElementById("count");
    const hintEl = document.getElementById("hint");
    const tapBtn = document.getElementById("tap");

    function show(n) {
      n = Number(n);
      if (n < current) return; // ignore stale updates arriving out of order
      current = n;
      countEl.textContent = n.toLocaleString();
      countEl.classList.add("bump");
      setTimeout(() => countEl.classList.remove("bump"), 80);
    }

    async function refresh() {
      const { data } = await supabase.from("excuseme_counter").select("value").eq("id", 1).single();
      if (data) show(data.value);
    }

    function watch() {
      refresh();
      supabase
        .channel("excuseme")
        .on("postgres_changes",
          { event: "UPDATE", schema: "public", table: "excuseme_counter" },
          (p) => show(p.new.value))
        .subscribe();
      setInterval(refresh, 5000); // backup in case live updates drop
    }

    async function press() {
      const { data, error } = await supabase.rpc("excuseme_press", { word: username });
      if (!error) show(data);
    }

    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      username = document.getElementById("username").value.trim();
      if (!username) return;
      const { data } = await supabase.rpc("excuseme_check", { word: username });
      isEditor = data === true;

      document.getElementById("login").style.display = "none";
      document.getElementById("counter").style.display = "block";
      hintEl.textContent = isEditor ? "Press the SPACEBAR to add 1." : "Watching as " + username + ".";
      if (isEditor) tapBtn.style.display = "inline-block";
      watch();
    });

    document.addEventListener("keydown", (e) => {
      if (!isEditor || e.code !== "Space") return;
      e.preventDefault();
      if (e.repeat) return; // holding the key counts once
      press();
    });

    tapBtn.addEventListener("click", (e) => { e.currentTarget.blur(); press(); });
  </script>
</body>
</html>
